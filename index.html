<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Kas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper: #F2ECDC;
    --paper-edge: #E7DFC8;
    --ink: #24302A;
    --ink-soft: #5B6459;
    --rule: #C9BFA0;
    --rule-strong: #A99E7B;
    --debit: #8C3B2E;
    --debit-bg: #F4E4DF;
    --credit: #2F5D50;
    --credit-bg: #E3ECE6;
    --gold: #A6822F;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      repeating-linear-gradient(transparent, transparent 27px, rgba(169,158,123,0.16) 28px);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    padding: 40px 20px 80px;
  }

  .page{
    max-width: 760px;
    margin: 0 auto;
  }

  .masthead{
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 28px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }

  .masthead h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size: 2.1rem;
    margin:0;
    letter-spacing:0.2px;
  }

  .masthead .tanggal{
    font-size:0.85rem;
    color: var(--ink-soft);
  }

  .saldo-block{
    margin: 26px 0 30px;
  }
  .saldo-label{
    font-size:0.8rem;
    color: var(--ink-soft);
    margin-bottom:4px;
  }
  .saldo-angka{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 3rem;
    line-height:1;
    font-variant-numeric: tabular-nums;
  }
  .saldo-angka.negatif{ color: var(--debit); }

  .ringkasan{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 32px;
  }
  .kartu{
    border: 1px solid var(--rule-strong);
    padding: 14px 16px;
    background: rgba(255,255,255,0.35);
  }
  .kartu .label{
    font-size:0.78rem;
    color: var(--ink-soft);
    margin-bottom:6px;
  }
  .kartu .nilai{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.35rem;
    font-variant-numeric: tabular-nums;
  }
  .kartu.masuk .nilai{ color: var(--credit); }
  .kartu.keluar .nilai{ color: var(--debit); }

  form.entri{
    border: 1px solid var(--rule-strong);
    padding: 18px;
    margin-bottom: 34px;
    background: rgba(255,255,255,0.3);
  }
  form.entri h2{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:1.15rem;
    margin: 0 0 14px;
  }

  .baris-form{
    display:grid;
    grid-template-columns: 1fr 2fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  @media (max-width: 560px){
    .baris-form{ grid-template-columns: 1fr; }
    .ringkasan{ grid-template-columns: 1fr; }
  }

  label{
    display:block;
    font-size:0.75rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  input[type=text], input[type=number], input[type=date]{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
    padding: 8px 9px;
    border: 1px solid var(--rule-strong);
    background: var(--paper);
    color: var(--ink);
  }
  input:focus{
    outline: 2px solid var(--gold);
    outline-offset:1px;
  }

  .jenis-toggle{
    display:flex;
    border: 1px solid var(--rule-strong);
    overflow:hidden;
  }
  .jenis-toggle button{
    flex:1;
    padding: 9px 6px;
    background: var(--paper);
    border:none;
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    cursor:pointer;
    color: var(--ink-soft);
    border-right: 1px solid var(--rule-strong);
  }
  .jenis-toggle button:last-child{ border-right:none; }
  .jenis-toggle button.aktif.masuk{ background: var(--credit); color:#fff; }
  .jenis-toggle button.aktif.keluar{ background: var(--debit); color:#fff; }

  .tambah-btn{
    margin-top: 6px;
    padding: 10px 20px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
  }
  .tambah-btn:hover{ background: #16201A; }
  .tambah-btn:disabled{ opacity:0.5; cursor:default; }

  .riwayat h2{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:1.15rem;
    margin: 0 0 14px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 8px;
  }

  table{
    width:100%;
    border-collapse: collapse;
    font-size:0.88rem;
  }
  thead th{
    text-align:left;
    font-weight:600;
    font-size:0.75rem;
    color: var(--ink-soft);
    padding: 6px 8px;
    border-bottom: 1px solid var(--rule-strong);
  }
  thead th.num, td.num{ text-align:right; }
  tbody td{
    padding: 9px 8px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }
  tbody tr:hover{ background: rgba(255,255,255,0.4); }
  td.jumlah-masuk{ color: var(--credit); font-variant-numeric: tabular-nums; }
  td.jumlah-keluar{ color: var(--debit); font-variant-numeric: tabular-nums; }
  td.saldo-jalan{ font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  td.tanggal-cell{ white-space:nowrap; color: var(--ink-soft); }

  .hapus-btn{
    background:none;
    border:none;
    color: var(--ink-soft);
    cursor:pointer;
    font-size:0.78rem;
    text-decoration: underline;
    padding:0;
  }
  .hapus-btn:hover{ color: var(--debit); }

  .kosong{
    padding: 30px 10px;
    text-align:center;
    color: var(--ink-soft);
    font-style:italic;
    font-family:'Fraunces', serif;
  }

  .kaki{
    margin-top: 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.78rem;
    color: var(--ink-soft);
  }
  .kaki button{
    background:none;
    border:none;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor:pointer;
    font-size:0.78rem;
    padding:0;
  }
  .kaki button:hover{ color: var(--debit); }

  .status{
    font-size:0.8rem;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }

  .keinginan{
    margin-top: 40px;
  }
  .keinginan h2{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:1.15rem;
    margin: 0 0 6px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 8px;
  }
  .keinginan .sub{
    font-size:0.8rem;
    color: var(--ink-soft);
    margin: 8px 0 16px;
  }

  form.entri-keinginan{
    border: 1px solid var(--rule-strong);
    padding: 16px;
    margin-bottom: 20px;
    background: rgba(255,255,255,0.3);
  }
  .baris-keinginan{
    display:grid;
    grid-template-columns: 2fr 1fr auto;
    gap: 12px;
    align-items:flex-end;
  }
  @media (max-width: 560px){
    .baris-keinginan{ grid-template-columns: 1fr; }
  }

  .daftar-keinginan{
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .item-keinginan{
    display:flex;
    align-items:center;
    gap: 14px;
    border: 1px solid var(--rule);
    padding: 12px 14px;
    background: rgba(255,255,255,0.25);
  }
  .item-keinginan.tercapai{
    border-color: var(--credit);
    background: var(--credit-bg);
  }
  .item-keinginan .info{
    flex:1;
    min-width:0;
  }
  .item-keinginan .nama{
    font-weight:600;
    font-size:0.94rem;
    margin-bottom:2px;
  }
  .item-keinginan .harga{
    font-size:0.85rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .status-dana{
    font-size:0.78rem;
    padding: 3px 9px;
    white-space:nowrap;
    border: 1px solid var(--rule-strong);
  }
  .status-dana.cukup{
    color: var(--credit);
    border-color: var(--credit);
  }
  .status-dana.kurang{
    color: var(--debit);
    border-color: var(--debit);
  }
  .item-keinginan .sudah-beli{
    background:none;
    border: 1px solid var(--rule-strong);
    padding: 6px 12px;
    font-size:0.78rem;
    cursor:pointer;
    color: var(--ink-soft);
    font-family:'Inter', sans-serif;
  }
  .item-keinginan .sudah-beli:hover{
    background: var(--ink);
    color: var(--paper);
  }
</style>
</head>
<body>

<div class="page">

  <div class="masthead">
    <h1>Buku Kas</h1>
    <div class="tanggal" id="tanggalHariIni"></div>
  </div>

  <div id="status" class="status" style="display:none;"></div>

  <div id="isiUtama">

    <div class="saldo-block">
      <div class="saldo-label">Saldo saat ini</div>
      <div class="saldo-angka" id="saldoTotal">Rp 0</div>
    </div>

    <div class="ringkasan">
      <div class="kartu masuk">
        <div class="label">Total pemasukan</div>
        <div class="nilai" id="totalMasuk">Rp 0</div>
      </div>
      <div class="kartu keluar">
        <div class="label">Total pengeluaran</div>
        <div class="nilai" id="totalKeluar">Rp 0</div>
      </div>
    </div>

    <form class="entri" id="formEntri">
      <h2>Catat transaksi</h2>
      <div class="baris-form">
        <div>
          <label for="inputTanggal">Tanggal</label>
          <input type="date" id="inputTanggal" required>
        </div>
        <div>
          <label for="inputKeterangan">Keterangan</label>
          <input type="text" id="inputKeterangan" placeholder="Misal: Gaji, Makan siang" required>
        </div>
        <div>
          <label for="inputJumlah">Jumlah (Rp)</label>
          <input type="number" id="inputJumlah" placeholder="0" min="0" step="1" required>
        </div>
      </div>
      <div class="baris-form" style="grid-template-columns: 140px 200px 1fr;">
        <div>
          <label for="inputJam">Jam</label>
          <input type="time" id="inputJam" required>
        </div>
        <div>
          <label>Jenis</label>
          <div class="jenis-toggle">
            <button type="button" id="btnMasuk" class="aktif masuk">Pemasukan</button>
            <button type="button" id="btnKeluar" class="keluar">Pengeluaran</button>
          </div>
        </div>
        <div style="display:flex; align-items:flex-end;">
          <button type="submit" class="tambah-btn">Tambah catatan</button>
        </div>
      </div>
    </form>

    <div class="riwayat">
      <h2>Riwayat transaksi</h2>
      <div id="tabelWrap"></div>
    </div>

    <div class="keinginan">
      <h2>Daftar keinginan</h2>
      <div class="sub">Catat barang yang mau kamu beli — otomatis dibandingkan dengan saldo saat ini.</div>

      <form class="entri-keinginan" id="formKeinginan">
        <div class="baris-keinginan">
          <div>
            <label for="inputNamaBarang">Nama barang</label>
            <input type="text" id="inputNamaBarang" placeholder="Misal: Sepatu, Laptop baru" required>
          </div>
          <div>
            <label for="inputHargaBarang">Harga (Rp)</label>
            <input type="number" id="inputHargaBarang" placeholder="0" min="0" step="1" required>
          </div>
          <button type="submit" class="tambah-btn">Tambah</button>
        </div>
      </form>

      <div class="daftar-keinginan" id="daftarKeinginan"></div>
    </div>

    <div class="kaki">
      <span id="jumlahCatatan"></span>
      <button id="btnReset" type="button">Hapus semua catatan</button>
    </div>

  </div>

</div>

<script>
  const STORAGE_KEY = 'buku-kas-transaksi';
  const STORAGE_KEY_KEINGINAN = 'buku-kas-keinginan';
  let transaksi = [];
  let keinginan = [];
  let jenisAktif = 'masuk';
  let saldoTerkini = 0;

  const el = (id) => document.getElementById(id);
  const formatRupiah = (n) => 'Rp ' + Math.round(n).toLocaleString('id-ID');
  const formatTanggal = (isoStr) => {
    const d = new Date(isoStr + 'T00:00:00');
    return d.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
  };
  const formatTanggalJam = (isoStr, jam) => {
    return formatTanggal(isoStr) + (jam ? ', ' + jam : '');
  };

  el('tanggalHariIni').textContent = new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  el('inputTanggal').value = new Date().toISOString().slice(0,10);
  el('inputJam').value = new Date().toTimeString().slice(0,5);

  // ---- Penyimpanan pakai localStorage bawaan browser ----
  function muatData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      transaksi = raw ? JSON.parse(raw) : [];
    }catch(e){
      transaksi = [];
    }
    try{
      const rawKeinginan = localStorage.getItem(STORAGE_KEY_KEINGINAN);
      keinginan = rawKeinginan ? JSON.parse(rawKeinginan) : [];
    }catch(e){
      keinginan = [];
    }
    render();
  }

  function simpanData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(transaksi));
      tampilkanStatus('');
    }catch(e){
      tampilkanStatus('Gagal menyimpan catatan di perangkat ini.');
    }
  }

  function simpanKeinginan(){
    try{
      localStorage.setItem(STORAGE_KEY_KEINGINAN, JSON.stringify(keinginan));
      tampilkanStatus('');
    }catch(e){
      tampilkanStatus('Gagal menyimpan daftar keinginan di perangkat ini.');
    }
  }

  function tampilkanStatus(pesan){
    const s = el('status');
    if(pesan){
      s.textContent = pesan;
      s.style.display = 'block';
    } else {
      s.style.display = 'none';
    }
  }

  function render(){
    const totalMasuk = transaksi.filter(t => t.jenis==='masuk').reduce((a,t)=>a+t.jumlah,0);
    const totalKeluar = transaksi.filter(t => t.jenis==='keluar').reduce((a,t)=>a+t.jumlah,0);
    const saldo = totalMasuk - totalKeluar;

    el('totalMasuk').textContent = formatRupiah(totalMasuk);
    el('totalKeluar').textContent = formatRupiah(totalKeluar);
    const saldoEl = el('saldoTotal');
    saldoEl.textContent = formatRupiah(saldo);
    saldoEl.classList.toggle('negatif', saldo < 0);
    saldoTerkini = saldo;

    // urutkan kronologis untuk hitung saldo berjalan
    const urutKronologis = [...transaksi].sort((a,b) => {
      const kunciA = a.tanggal + 'T' + (a.jam || '00:00');
      const kunciB = b.tanggal + 'T' + (b.jam || '00:00');
      if(kunciA !== kunciB) return kunciA.localeCompare(kunciB);
      return a.dibuat - b.dibuat;
    });
    let berjalan = 0;
    const saldoPerId = {};
    urutKronologis.forEach(t => {
      berjalan += t.jenis === 'masuk' ? t.jumlah : -t.jumlah;
      saldoPerId[t.id] = berjalan;
    });

    // tampilkan terbaru dulu
    const urutTampil = [...transaksi].sort((a,b) => {
      const kunciA = a.tanggal + 'T' + (a.jam || '00:00');
      const kunciB = b.tanggal + 'T' + (b.jam || '00:00');
      if(kunciA !== kunciB) return kunciB.localeCompare(kunciA);
      return b.dibuat - a.dibuat;
    });

    el('jumlahCatatan').textContent = transaksi.length + ' catatan';

    const wrap = el('tabelWrap');
    if(urutTampil.length === 0){
      wrap.innerHTML = '<div class="kosong">Belum ada catatan. Tambahkan transaksi pertamamu di atas.</div>';
    } else {
      let html = '<table><thead><tr>' +
        '<th>Waktu</th><th>Keterangan</th>' +
        '<th class="num">Masuk</th><th class="num">Keluar</th>' +
        '<th class="num">Saldo</th><th></th>' +
        '</tr></thead><tbody>';

      urutTampil.forEach(t => {
        html += '<tr>' +
          '<td class="tanggal-cell">' + formatTanggalJam(t.tanggal, t.jam) + '</td>' +
          '<td>' + escapeHtml(t.keterangan) + '</td>' +
          '<td class="num jumlah-masuk">' + (t.jenis==='masuk' ? formatRupiah(t.jumlah) : '—') + '</td>' +
          '<td class="num jumlah-keluar">' + (t.jenis==='keluar' ? formatRupiah(t.jumlah) : '—') + '</td>' +
          '<td class="num saldo-jalan">' + formatRupiah(saldoPerId[t.id]) + '</td>' +
          '<td><button class="hapus-btn" data-id="' + t.id + '">hapus</button></td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      wrap.innerHTML = html;

      wrap.querySelectorAll('.hapus-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          transaksi = transaksi.filter(t => t.id !== btn.dataset.id);
          simpanData();
          render();
        });
      });
    }

    renderKeinginan();
  }

  function renderKeinginan(){
    const wrap = el('daftarKeinginan');
    if(keinginan.length === 0){
      wrap.innerHTML = '<div class="kosong">Belum ada barang yang dicatat. Tambahkan yang kamu incar di atas.</div>';
      return;
    }

    // urutkan: yang belum tercapai dan termurah dulu
    const urut = [...keinginan].sort((a,b) => {
      const aCukup = saldoTerkini >= a.harga;
      const bCukup = saldoTerkini >= b.harga;
      if(aCukup !== bCukup) return aCukup ? -1 : 1;
      return a.harga - b.harga;
    });

    wrap.innerHTML = urut.map(item => {
      const cukup = saldoTerkini >= item.harga;
      const kurang = item.harga - saldoTerkini;
      return '<div class="item-keinginan ' + (cukup ? 'tercapai' : '') + '">' +
        '<div class="info">' +
          '<div class="nama">' + escapeHtml(item.nama) + '</div>' +
          '<div class="harga">' + formatRupiah(item.harga) + '</div>' +
        '</div>' +
        '<div class="status-dana ' + (cukup ? 'cukup' : 'kurang') + '">' +
          (cukup ? 'Saldo cukup' : 'Kurang ' + formatRupiah(kurang)) +
        '</div>' +
        '<button class="sudah-beli" data-id="' + item.id + '">Sudah dibeli</button>' +
      '</div>';
    }).join('');

    wrap.querySelectorAll('.sudah-beli').forEach(btn => {
      btn.addEventListener('click', () => {
        keinginan = keinginan.filter(k => k.id !== btn.dataset.id);
        simpanKeinginan();
        renderKeinginan();
      });
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  el('btnMasuk').addEventListener('click', () => {
    jenisAktif = 'masuk';
    el('btnMasuk').classList.add('aktif');
    el('btnKeluar').classList.remove('aktif');
  });
  el('btnKeluar').addEventListener('click', () => {
    jenisAktif = 'keluar';
    el('btnKeluar').classList.add('aktif');
    el('btnMasuk').classList.remove('aktif');
  });

  el('formEntri').addEventListener('submit', (e) => {
    e.preventDefault();
    const tanggal = el('inputTanggal').value;
    const jam = el('inputJam').value;
    const keterangan = el('inputKeterangan').value.trim();
    const jumlah = parseFloat(el('inputJumlah').value);

    if(!tanggal || !keterangan || !jumlah || jumlah <= 0) return;

    transaksi.push({
      id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      tanggal, jam, keterangan, jumlah,
      jenis: jenisAktif,
      dibuat: Date.now()
    });

    simpanData();
    render();

    el('inputKeterangan').value = '';
    el('inputJumlah').value = '';
    el('inputJam').value = new Date().toTimeString().slice(0,5);
    el('inputKeterangan').focus();
  });

  el('formKeinginan').addEventListener('submit', (e) => {
    e.preventDefault();
    const nama = el('inputNamaBarang').value.trim();
    const harga = parseFloat(el('inputHargaBarang').value);
    if(!nama || !harga || harga <= 0) return;

    keinginan.push({
      id: 'wl_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      nama, harga,
      dibuat: Date.now()
    });

    simpanKeinginan();
    renderKeinginan();

    el('inputNamaBarang').value = '';
    el('inputHargaBarang').value = '';
    el('inputNamaBarang').focus();
  });

  el('btnReset').addEventListener('click', () => {
    if(!confirm('Hapus semua catatan pemasukan dan pengeluaran? Tindakan ini tidak bisa dibatalkan.')) return;
    transaksi = [];
    simpanData();
    render();
  });

  muatData();
</script>

</body>
</html>
