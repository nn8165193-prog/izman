<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Basic Challenge</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:#05080d;color:#d7fbe8;
    font-family:Consolas,"Courier New",monospace;display:flex;align-items:center;
    justify-content:center;overflow-x:hidden;
  }
  body:before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;
    background:linear-gradient(rgba(0,255,120,.05) 1px,transparent 1px),
               linear-gradient(90deg,rgba(0,255,120,.05) 1px,transparent 1px);
    background-size:35px 35px;
  }
  .wrap{width:min(900px,94vw);position:relative}
  .terminal{
    border:1px solid #16ff78;border-radius:14px;background:rgba(5,12,17,.96);
    box-shadow:0 0 30px rgba(0,255,110,.12), inset 0 0 40px rgba(0,255,110,.025);
    overflow:hidden;
  }
  .bar{height:44px;border-bottom:1px solid #123c27;display:flex;align-items:center;padding:0 15px;gap:8px}
  .dot{width:11px;height:11px;border-radius:50%;background:#20ff7b;box-shadow:0 0 8px #20ff7b}
  .title{margin-left:8px;color:#78ffae;font-size:13px}
  .screen{padding:28px}
  .logo{color:#20ff7b;font-size:clamp(25px,5vw,44px);font-weight:bold;text-shadow:0 0 14px rgba(32,255,123,.5)}
  .sub{color:#719b82;margin:7px 0 22px}
  .hud{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .box{border:1px solid #155d37;padding:9px 13px;border-radius:8px;background:#08140e}
  .box b{color:#20ff7b}
  .progress{height:8px;background:#0b1d14;border-radius:20px;overflow:hidden;margin:10px 0 24px}
  .fill{height:100%;width:0;background:#20ff7b;box-shadow:0 0 12px #20ff7b;transition:.25s}
  .qnum{color:#20ff7b;margin-bottom:10px}
  .question{font-size:20px;line-height:1.5;margin-bottom:20px;color:#f0fff6}
  code{color:#66ffac;background:#091a11;padding:2px 6px;border-radius:4px}
  .answers{display:grid;gap:11px}
  button{
    font:inherit;color:#d7fbe8;background:#08130d;border:1px solid #1c6b42;
    border-radius:9px;padding:13px 15px;text-align:left;cursor:pointer;transition:.15s;
  }
  button:hover{background:#0d2418;border-color:#20ff7b;transform:translateX(3px)}
  button.correct{border-color:#20ff7b;background:#0d3a20;color:#8dffba}
  button.wrong{border-color:#ff5364;background:#3b1118;color:#ff9ba5}
  button:disabled{cursor:default;transform:none}
  .feedback{min-height:30px;margin-top:16px;font-weight:bold}
  .good{color:#20ff7b}.bad{color:#ff6675}
  .next{display:none;width:100%;margin-top:8px;text-align:center;border-color:#20ff7b}
  .start{text-align:center}
  .start p{color:#8caf99;line-height:1.6}
  .start button{display:inline-block;text-align:center;background:#0a2a18;border-color:#20ff7b}
  .result{text-align:center}
  .result .big{font-size:70px;color:#20ff7b;font-weight:bold;text-shadow:0 0 18px rgba(32,255,123,.4)}
  .result button{text-align:center;display:inline-block;margin-top:15px}
  .tiny{color:#537a63;font-size:12px;margin-top:20px}
  @media(max-width:600px){.screen{padding:20px}.question{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="terminal">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="title">html_basic_challenge.exe</span></div>
    <div class="screen" id="app"></div>
  </div>
</div>

<script>
const questions = [
["HTML adalah singkatan dari ...",["Hyper Text Markup Language","High Tech Modern Language","Hyperlink Text Management Language","Home Tool Markup Language"],0],
["Tag untuk judul terbesar adalah ...",["<h6>","<heading>","<h1>","<title>"],2],
["Tag untuk membuat paragraf adalah ...",["<p>","<para>","<text>","<pg>"],0],
["Tag untuk membuat link adalah ...",["<link>","<a>","<href>","<url>"],1],
["Atribut untuk menentukan alamat tujuan link adalah ...",["src","link","href","target"],2],
["Tag untuk menampilkan gambar adalah ...",["<image>","<img>","<picture>","<src>"],1],
["Atribut <img> yang digunakan untuk alamat gambar adalah ...",["href","alt","src","path"],2],
["Atribut alt pada gambar berguna untuk ...",["Mengatur ukuran gambar","Teks alternatif gambar","Membuat gambar bergerak","Mengubah warna gambar"],1],
["Tag untuk membuat daftar tidak berurutan adalah ...",["<ol>","<list>","<ul>","<li>"],2],
["Tag untuk setiap item dalam list adalah ...",["<item>","<li>","<ul>","<point>"],1],
["Tag untuk daftar berurutan adalah ...",["<ol>","<ul>","<order>","<li>"],0],
["Tag HTML untuk membuat baris baru adalah ...",["<newline>","<br>","<break>","<lb>"],1],
["Tag untuk membuat garis horizontal adalah ...",["<line>","<hr>","<border>","<br>"],1],
["Tag untuk membuat tabel adalah ...",["<table>","<tab>","<grid>","<tbl>"],0],
["Tag untuk baris tabel adalah ...",["<td>","<tr>","<row>","<th>"],1],
["Tag untuk sel data tabel adalah ...",["<cell>","<data>","<td>","<tr>"],2],
["Tag untuk header tabel adalah ...",["<thead>","<header>","<th>","<td>"],2],
["Tag untuk membuat form adalah ...",["<form>","<input>","<fieldset>","<data>"],0],
["Tag input biasanya digunakan untuk ...",["Membuat judul","Menerima masukan pengguna","Membuat gambar","Membuat paragraf"],1],
["Atribut input untuk menentukan jenis input adalah ...",["kind","type","input-type","mode"],1],
["Tag untuk tombol adalah ...",["<button>","<btn>","<click>","<press>"],0],
["Tag untuk membuat komentar HTML adalah ...",["// komentar","/* komentar */","<!-- komentar -->","# komentar"],2],
["Ekstensi file HTML biasanya adalah ...",[".css",".js",".html",".web"],2],
["Deklarasi DOCTYPE HTML5 adalah ...",["<!HTML5>","<!DOCTYPE html>","<DOCTYPE=5>","<!HTML>"],1],
["Tag <head> berisi ...",["Konten utama yang tampil di halaman","Metadata dan informasi dokumen","Hanya gambar","Hanya tombol"],1],
["Tag <body> berisi ...",["Metadata","Konten yang ditampilkan di halaman","Kode CSS saja","Judul browser saja"],1],
["Tag <title> biasanya menentukan ...",["Judul yang tampil di tab browser","Judul terbesar di halaman","Nama file","Warna halaman"],0],
["Tag semantik untuk navigasi adalah ...",["<navigate>","<nav>","<menu-bar>","<links>"],1],
["Tag semantik untuk bagian utama halaman adalah ...",["<main>","<primary>","<content>","<section-main>"],0],
["Tag semantik untuk bagian footer adalah ...",["<bottom>","<end>","<footer>","<foot>"],2],
["Tag untuk membuat bagian/section umum adalah ...",["<section>","<part>","<area>","<block>"],0],
["Tag <div> umumnya digunakan sebagai ...",["Kontainer umum","Judul utama","Gambar","Link"],0],
["Tag <span> biasanya digunakan untuk ...",["Kontainer inline","Membuat tabel","Membuat video","Membuat form"],0],
["Atribut id digunakan untuk ...",["Memberi identitas unik pada elemen","Mengubah ukuran gambar","Membuat link otomatis","Menentukan bahasa"],0],
["Atribut class digunakan untuk ...",["Mengelompokkan elemen","Menghapus elemen","Membuat database","Menjalankan JavaScript"],0],
["Bahasa yang biasa digunakan untuk mengatur tampilan HTML adalah ...",["Python","CSS","SQL","PHP"],1],
["Bahasa yang biasa digunakan untuk membuat interaksi pada halaman web adalah ...",["JavaScript","HTML","CSS","XML"],0],
["Tag untuk menautkan file CSS eksternal adalah ...",["<css>","<style src>","<link>","<script>"],2],
["Atribut yang digunakan pada <link> untuk menentukan file CSS adalah ...",["src","href","file","path"],1],
["Tag untuk JavaScript eksternal adalah ...",["<javascript>","<js>","<script>","<code>"],2],
["Atribut script untuk menentukan file JavaScript adalah ...",["href","src","file","js"],1],
["Tag untuk membuat teks tebal secara semantik adalah ...",["<bold>","<strong>","<bolder>","<thick>"],1],
["Tag untuk penekanan teks secara semantik adalah ...",["<italic>","<em>","<i-text>","<stress>"],1],
["Tag <i> biasanya menampilkan teks ...",["Miring","Tebal","Besar","Bergaris"],0],
["Tag <u> biasanya digunakan untuk ...",["Membuat teks bergaris bawah","Membuat teks tebal","Membuat teks merah","Membuat link"],0],
["Atribut lang pada <html> digunakan untuk ...",["Menentukan bahasa dokumen","Mengatur ukuran font","Mengatur link","Memilih browser"],0],
["Meta viewport berguna terutama untuk ...",["Responsive pada perangkat berbeda","Membuat database","Mengatur server","Membuat animasi"],0],
["Tag <video> digunakan untuk ...",["Memutar video","Membuat gambar","Membuat audio saja","Membuat tabel"],0],
["Tag <audio> digunakan untuk ...",["Memutar audio","Membuat video","Membuat link","Membuat form"],0],
["Atribut target=\"_blank\" pada link biasanya ...",["Membuka link di tab/jendela baru","Menghapus link","Membuat link berwarna","Menutup browser"],0],
["Tag <label> biasanya digunakan untuk ...",["Memberi label pada kontrol form","Membuat tabel","Membuat gambar","Membuat footer"],0]
];

let pool=[], index=0, score=0, answered=false;

function shuffle(arr){ return arr.sort(()=>Math.random()-0.5); }

function showStart(){
  document.getElementById("app").innerHTML = `
    <div class="start">
      <div class="logo">&lt;HTML_CHALLENGE/&gt;</div>
      <div class="sub">// BASIC PROGRAMMING QUIZ</div>
      <p>Uji kemampuan HTML dasar kamu dalam mode terminal.</p>
      <div class="hud">
        <div class="box">BENAR: <b>+10</b></div>
        <div class="box">SALAH: <b>-5</b></div>
        <div class="box">TARGET: <b>100</b></div>
        <div class="box">SOAL: <b>${questions.length}</b></div>
      </div>
      <p>Jawab soal sebanyak yang diperlukan. Jika skor mencapai <b style="color:#20ff7b">100</b>, kamu menang!</p>
      <button onclick="startGame()">[ MULAI GAME ]</button>
      <div class="tiny">Tips: baca kode dan konsepnya dengan teliti.</div>
    </div>`;
}

function startGame(){
  pool=shuffle(questions.map(q=>[q[0],[...q[1]],q[2]]));
  index=0; score=0; answered=false; renderQuestion();
}

function renderQuestion(){
  if(score>=100){showResult(true);return;}
  if(index>=pool.length){ pool=shuffle(questions.map(q=>[q[0],[...q[1]],q[2]])); index=0; }
  answered=false;
  const q=pool[index];
  document.getElementById("app").innerHTML=`
    <div class="hud">
      <div class="box">SCORE: <b>${score}</b></div>
      <div class="box">SOAL: <b>${index+1}</b></div>
      <div class="box">TARGET: <b>100</b></div>
    </div>
    <div class="progress"><div class="fill" style="width:${Math.max(0,Math.min(100,score))}%"></div></div>
    <div class="qnum">[ QUESTION ${index+1} ]</div>
    <div class="question">${escapeHtml(q[0])}</div>
    <div class="answers">${q[1].map((a,i)=>`<button onclick="answer(${i})">${String.fromCharCode(65+i)}. ${escapeHtml(a)}</button>`).join("")}</div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next" onclick="nextQuestion()">[ SOAL BERIKUTNYA → ]</button>
  `;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function answer(choice){
  if(answered)return;
  answered=true;
  const q=pool[index], buttons=document.querySelectorAll(".answers button");
  buttons.forEach(b=>b.disabled=true);
  buttons[q[2]].classList.add("correct");
  const feedback=document.getElementById("feedback");
  if(choice===q[2]){
    score+=10;
    feedback.innerHTML='<span class="good">✓ BENAR! +10 poin</span>';
  }else{
    score-=5;
    buttons[choice].classList.add("wrong");
    feedback.innerHTML=`<span class="bad">✗ SALAH! -5 poin</span> <span style="color:#8caf99">Jawaban benar: ${String.fromCharCode(65+q[2])}</span>`;
  }
  document.querySelector(".box b").textContent=score;
  document.querySelector(".fill").style.width=Math.max(0,Math.min(100,score))+"%";
  if(score>=100){
    setTimeout(()=>showResult(true),450);
  }else{
    document.getElementById("next").style.display="block";
  }
}

function nextQuestion(){ index++; renderQuestion(); }

function showResult(win){
  document.getElementById("app").innerHTML=`
    <div class="result">
      <div class="logo">&lt;/MISSION_COMPLETE/&gt;</div>
      <div class="sub">// ACCESS GRANTED</div>
      <div class="big">${score}</div>
      <p style="color:#20ff7b;font-size:18px">🎉 SELAMAT! KAMU MENANG!</p>
      <p>Kamu berhasil mencapai target <b>100 poin</b> dalam HTML Basic Challenge.</p>
      <button onclick="startGame()">[ MAIN LAGI ]</button>
      <div class="tiny">Terus latihan untuk menguasai HTML, CSS, dan JavaScript.</div>
    </div>`;
}
showStart();
</script>
</body>
</html>
